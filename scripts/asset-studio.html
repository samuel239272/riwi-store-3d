<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RIWI · estudio de muestras 3D</title>
  <style>body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { createGarment } from '../src/three/garments.ts';

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(900, 1000);
renderer.setPixelRatio(1.5);
renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 0.9, 0.1, 40);
scene.add(new THREE.AmbientLight('#ffffff', 1.4));
for (const [color, power, pos] of [['#fff8f0', 3, [3, 5, 6]], ['#dcd4ff', 2, [-4, 2, 2]], ['#ffffff', 2, [1, 3, -4]]]) {
  const l = new THREE.DirectionalLight(color, power);
  l.position.set(...pos);
  scene.add(l);
}

const texLoader = new THREE.TextureLoader();
const objLoader = new OBJLoader();

function createConformingPatch(targetGroup, logoTexture, {
  center,
  width,
  height,
  gridX = 24,
  gridY = 8,
  dir = new THREE.Vector3(0, 0, -1),
  rayOriginDistance = 1.0,
  normalOffset = 0.0035,
  roughness = 0.52,
  metalness = 0.04,
}) {
  const meshes = [];
  targetGroup.traverse(c => {
    if (c.isMesh) meshes.push(c);
  });

  const forward = dir.clone().normalize();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(worldUp, forward.clone().negate()).normalize();
  const up = new THREE.Vector3().crossVectors(forward.clone().negate(), right).normalize();

  const cVec = new THREE.Vector3(center.x, center.y, center.z);
  const geom = new THREE.PlaneGeometry(width, height, gridX, gridY);
  const posAttr = geom.attributes.position;
  const normAttr = geom.attributes.normal;

  const raycaster = new THREE.Raycaster();

  raycaster.set(cVec.clone().sub(forward.clone().multiplyScalar(rayOriginDistance)), forward);
  const centerHits = raycaster.intersectObjects(meshes, true);
  const baseHit = centerHits[0];
  const baseHitNormal = baseHit && baseHit.face ? baseHit.face.normal.clone().normalize() : forward.clone().negate();

  for (let iy = 0; iy <= gridY; iy++) {
    const vNorm = 0.5 - (iy / gridY);
    for (let ix = 0; ix <= gridX; ix++) {
      const uNorm = (ix / gridX) - 0.5;
      const vertIdx = iy * (gridX + 1) + ix;

      const pPlane = cVec.clone()
        .addScaledVector(right, uNorm * width)
        .addScaledVector(up, vNorm * height);

      const rayStart = pPlane.clone().sub(forward.clone().multiplyScalar(rayOriginDistance));
      raycaster.set(rayStart, forward);
      const hits = raycaster.intersectObjects(meshes, true);

      if (hits.length > 0) {
        const hit = hits[0];
        const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
        const worldNormal = hit.face.normal.clone().applyMatrix3(normalMatrix).normalize();
        const pFinal = hit.point.clone().addScaledVector(worldNormal, normalOffset);
        posAttr.setXYZ(vertIdx, pFinal.x, pFinal.y, pFinal.z);
        normAttr.setXYZ(vertIdx, worldNormal.x, worldNormal.y, worldNormal.z);
      } else {
        const pFinal = pPlane.clone().addScaledVector(baseHitNormal, normalOffset);
        posAttr.setXYZ(vertIdx, pFinal.x, pFinal.y, pFinal.z);
        normAttr.setXYZ(vertIdx, baseHitNormal.x, baseHitNormal.y, baseHitNormal.z);
      }
    }
  }

  posAttr.needsUpdate = true;
  normAttr.needsUpdate = true;

  const mat = new THREE.MeshStandardMaterial({
    name: 'brand',
    map: logoTexture,
    transparent: true,
    alphaTest: 0.02,
    roughness,
    metalness,
    side: THREE.DoubleSide,
    polygonOffset: true,
    polygonOffsetFactor: -3,
    polygonOffsetUnits: -3,
  });

  const mesh = new THREE.Mesh(geom, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function normalizeAndCenter(group, targetHeight, rotY = 0) {
  group.rotation.y = rotY;
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = targetHeight / size.y;

  group.traverse(child => {
    if (child.isMesh) {
      child.geometry = child.geometry.clone();
      child.geometry.applyMatrix4(child.matrixWorld);
      child.geometry.translate(-center.x, -center.y, -center.z);
      child.geometry.scale(scale, scale, scale);
      child.geometry.computeVertexNormals();
    }
  });
  group.position.set(0, 0, 0);
  group.rotation.set(0, 0, 0);
  group.scale.set(1, 1, 1);
  group.updateMatrixWorld(true);
  return group;
}

window.exportModel = async (kind) => {
  const logo = await texLoader.loadAsync('/logos/riwi-original.png');
  logo.colorSpace = THREE.SRGBColorSpace;

  let model;

  if (kind === 'tee') {
    const obj = await objLoader.loadAsync('/imported_assets/raw_models/tee.obj');
    normalizeAndCenter(obj, 2.35, Math.PI);
    const fabricMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#a99aff'),
      roughness: 0.80,
      metalness: 0.02,
      side: THREE.DoubleSide,
    });
    obj.traverse(c => {
      if (c.isMesh) c.material = fabricMat;
    });
    const chestPatch = createConformingPatch(obj, logo, {
      center: { x: 0, y: 0.20, z: 0.47 },
      width: 0.44,
      height: 0.126,
      dir: new THREE.Vector3(0, 0, -1),
      normalOffset: 0.0035,
    });
    const neckLabel = createConformingPatch(obj, logo, {
      center: { x: 0, y: 0.68, z: -0.15 },
      width: 0.16,
      height: 0.046,
      dir: new THREE.Vector3(0, -0.4, 1).normalize(),
      normalOffset: 0.003,
    });
    model = new THREE.Group();
    model.add(obj, chestPatch, neckLabel);
  } else if (kind === 'sweatshirt') {
    const obj = await objLoader.loadAsync('/imported_assets/raw_models/buzo.obj');
    normalizeAndCenter(obj, 2.35, 0);
    const fabricMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#e8e5da'),
      roughness: 0.82,
      metalness: 0.02,
      side: THREE.DoubleSide,
    });
    obj.traverse(c => {
      if (c.isMesh) c.material = fabricMat;
    });
    const chestPatch = createConformingPatch(obj, logo, {
      center: { x: -0.23, y: 0.46, z: 0.45 },
      width: 0.20,
      height: 0.058,
      dir: new THREE.Vector3(0, 0, -1),
      normalOffset: 0.0035,
    });
    const neckLabel = createConformingPatch(obj, logo, {
      center: { x: 0, y: 0.66, z: -0.14 },
      width: 0.15,
      height: 0.044,
      dir: new THREE.Vector3(0, -0.35, 1).normalize(),
      normalOffset: 0.003,
    });
    model = new THREE.Group();
    model.add(obj, chestPatch, neckLabel);
  } else if (kind === 'hoodie') {
    const obj = await objLoader.loadAsync('/imported_assets/raw_models/hoodie.obj');
    normalizeAndCenter(obj, 2.35, 0);

    const normalMap = await texLoader.loadAsync('/imported_assets/hoodie/maps/hoodie_lp_T_hoodie_lp_Normal Map from Mesh_1001.jpg');
    const aoMap = await texLoader.loadAsync('/imported_assets/hoodie/maps/hoodie_lp_T_hoodie_lp_Ambient Occlusion Map from Mesh_1001.jpg');
    const cuffsNormal = await texLoader.loadAsync('/imported_assets/hoodie/maps/hoodie_lp_T_fabric_cuffs_normal.jpg');

    const bodyMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#a99aff'),
      normalMap,
      aoMap,
      aoMapIntensity: 0.75,
      roughness: 0.82,
      metalness: 0.02,
      side: THREE.DoubleSide,
    });
    const cuffMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#a99aff'),
      normalMap: cuffsNormal,
      roughness: 0.85,
      metalness: 0.02,
      side: THREE.DoubleSide,
    });
    const ropeMat = new THREE.MeshStandardMaterial({
      name: 'drawstring',
      color: new THREE.Color('#eae6db'),
      roughness: 0.9,
      metalness: 0.02,
    });
    const grommetMat = new THREE.MeshStandardMaterial({
      name: 'grommet',
      color: new THREE.Color('#c5c7cb'),
      roughness: 0.25,
      metalness: 0.88,
    });

    obj.traverse(c => {
      if (c.isMesh) {
        const n = (c.name || '').toLowerCase();
        if (n.includes('cuff')) {
          c.material = cuffMat;
        } else if (n.includes('rope')) {
          c.material = ropeMat;
        } else if (n.includes('button')) {
          c.material = grommetMat;
        } else {
          c.material = bodyMat;
        }
      }
    });

    const chestPatch = createConformingPatch(obj, logo, {
      center: { x: -0.22, y: 0.35, z: 0.15 },
      width: 0.22,
      height: 0.063,
      dir: new THREE.Vector3(0, 0, -1),
      normalOffset: 0.0035,
    });
    model = new THREE.Group();
    model.add(obj, chestPatch);
  } else if (kind === 'cap') {
    const obj = await objLoader.loadAsync('/imported_assets/raw_models/cap_clean.obj');
    normalizeAndCenter(obj, 1.25, Math.PI);

    const fabricMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#a99aff'),
      roughness: 0.82,
      metalness: 0.02,
      side: THREE.DoubleSide,
    });
    const buckleMat = new THREE.MeshStandardMaterial({
      name: 'buckle',
      color: new THREE.Color('#c5c7cb'),
      roughness: 0.22,
      metalness: 0.90,
    });

    obj.traverse(c => {
      if (c.isMesh) {
        if (c.name === 'BaseballCap_OBJ.006') {
          c.material = buckleMat;
        } else {
          c.material = fabricMat;
        }
      }
    });

    const crownPatch = createConformingPatch(obj, logo, {
      center: { x: 0, y: 0.16, z: 0.53 },
      width: 0.24,
      height: 0.075,
      dir: new THREE.Vector3(0, -0.25, -1).normalize(),
      normalOffset: 0.0035,
    });

    model = new THREE.Group();
    model.add(obj, crownPatch);
  } else if (kind === 'jacket') {
    const obj = await objLoader.loadAsync('/imported_assets/raw_models/jacket.obj');
    normalizeAndCenter(obj, 2.35, 0);

    const fabricNormal = await texLoader.loadAsync('/imported_assets/raw_models/jacket_textures/white_fabric_diffuse_normalauto.jpg');
    fabricNormal.wrapS = fabricNormal.wrapT = THREE.RepeatWrapping;
    fabricNormal.repeat.set(6, 6);

    const fabricMat = new THREE.MeshStandardMaterial({
      name: 'fabric',
      color: new THREE.Color('#e8e5da'),
      normalMap: fabricNormal,
      normalScale: new THREE.Vector2(0.55, 0.55),
      roughness: 0.78,
      metalness: 0.03,
      side: THREE.DoubleSide,
    });

    obj.traverse(c => {
      if (c.isMesh) c.material = fabricMat;
    });

    // Conforming logo patch on left chest panel
    const chestPatch = createConformingPatch(obj, logo, {
      center: { x: -0.16, y: 0.20, z: 0.38 },
      width: 0.28,
      height: 0.08,
      dir: new THREE.Vector3(0, 0, -1),
      normalOffset: 0.0035,
    });

    // Conforming inner collar neck tag
    const neckLabel = createConformingPatch(obj, logo, {
      center: { x: 0, y: 0.75, z: -0.15 },
      width: 0.16,
      height: 0.046,
      dir: new THREE.Vector3(0, -0.4, 1).normalize(),
      normalOffset: 0.003,
    });

    // Technical metallic zipper slider down the front seam
    const zipSliderGeo = new THREE.BoxGeometry(0.018, 0.036, 0.016);
    const zipPullGeo = new THREE.BoxGeometry(0.012, 0.045, 0.004);
    const zipMat = new THREE.MeshStandardMaterial({
      name: 'zipper',
      color: new THREE.Color('#d4d8de'),
      roughness: 0.22,
      metalness: 0.92,
    });
    const zipSlider = new THREE.Mesh(zipSliderGeo, zipMat);
    zipSlider.position.set(0, 0.40, 0.355);
    const zipPull = new THREE.Mesh(zipPullGeo, zipMat);
    zipPull.position.set(0, 0.37, 0.366);

    model = new THREE.Group();
    model.add(obj, chestPatch, neckLabel, zipSlider, zipPull);
  } else {
    model = createGarment(kind, undefined, '#a99aff', logo);
  }

  const bounds = new THREE.Box3().setFromObject(model);
  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());
  model.position.sub(center);

  const wrapper = new THREE.Group();
  wrapper.add(model);
  wrapper.scale.setScalar(2.65 / Math.max(size.x, size.y));

  const buffer = await new GLTFExporter().parseAsync(wrapper, { binary: true });
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(new Blob([buffer]));
  });
};

let current;
window.renderAsset = async (url, view, color) => {
  if (current) {
    scene.remove(current);
    current.traverse(o => {
      o.geometry?.dispose();
      if (o.material) {
        for (const m of [o.material].flat()) {
          m.map?.dispose();
          m.dispose();
        }
      }
    });
  }
  current = (await new GLTFLoader().loadAsync(url)).scene;
  current.traverse(o => {
    if (o.material?.name === 'fabric') o.material.color.set(color);
  });
  scene.add(current);

  const bounds = new THREE.Box3().setFromObject(current);
  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3());
  const distance = Math.max(size.y, size.x / 0.9) * 1.9;

  camera.position.set(view === 'back' ? -0.3 : 0.4, center.y + 0.13, view === 'back' ? -distance : distance);
  camera.lookAt(center);
  renderer.render(scene, camera);

  const output = document.createElement('canvas');
  output.width = 900;
  output.height = 1000;
  output.getContext('2d').drawImage(renderer.domElement, 0, 0, 900, 1000);
  return output.toDataURL('image/webp', 0.91);
};
</script>
</body>
